# Ultralytics YOLO11 object detection model with P3/8 - P5/32 outputs
# Model docs: https://docs.ultralytics.com/models/yolo11
# Task docs: https://docs.ultralytics.com/tasks/detect

# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolo11n.yaml' will call yolo11.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024] # summary: 181 layers, 2624080 parameters, 2624064 gradients, 6.6 GFLOPs
  s: [0.50, 0.50, 1024] # summary: 181 layers, 9458752 parameters, 9458736 gradients, 21.7 GFLOPs
  m: [0.50, 1.00, 512] # summary: 231 layers, 20114688 parameters, 20114672 gradients, 68.5 GFLOPs
  l: [1.00, 1.00, 512] # summary: 357 layers, 25372160 parameters, 25372144 gradients, 87.6 GFLOPs
  x: [1.00, 1.50, 512] # summary: 357 layers, 56966176 parameters, 56966160 gradients, 196.0 GFLOPs

# DaYa-YOLO
backbone:
  # [from, repeats, module, args]
  - [-1, 1, nn.Identity, []]      # 0: Raw Input Image [3, H, W]
  
  # --- MAIN BACKBONE (Structural Branch) ---
  - [0, 1, Conv, [64, 3, 2]]       # 1: P1/2
  - [-1, 1, Conv, [128, 3, 2]]      # 2: P2/4
  - [-1, 2, C3k2, [256, False]]    # 3
  - [-1, 1, Conv, [256, 3, 2]]      # 4: P3/8 (Main P3)
  - [-1, 2, C3k2, [512, False]]    # 5
  - [-1, 1, Conv, [512, 3, 2]]      # 6: P4/16 (Main P4)
  - [-1, 2, C3k2, [512, True]]     # 7
  - [-1, 1, Conv, [1024, 3, 2]]     # 8: P5/32 (Main P5)
  - [-1, 2, C3k2, [1024, True]]    # 9
  - [-1, 1, SPPF, [1024, 5]]       # 10
  - [-1, 2, C2PSA, [1024]]         # 11: Final Main Backbone Output

  # --- AUXILIARY BACKBONE (Chromatic Branch) ---
  - [0, 1, SpectralFeatureEncoder, [3, "LAB"]] # 12: Encoder (S=1, C=2), Encoder options: "RGB", "LAB"
  - [-1, 1, Conv, [16, 3, 2]]       # 13: Aux P1/2
  - [-1, 1, Conv, [16, 3, 2]]       # 14: Aux P2/4
  - [-1, 1, Conv, [32, 3, 2]]       # 15: Aux P3/8 (Color Clue P3)
  - [-1, 1, Conv, [64, 3, 2]]       # 16: Aux P4/16 (Color Clue P4)
  - [-1, 1, Conv, [64, 3, 2]]       # 17: Aux P5/32 (Color Clue P5)

# CP-YOLO11 Head (Triple-Fusion Strategy)
head:
  - [11, 1, nn.Upsample, [None, 2, "nearest"]] # 18: Up-P5 (index 11 is Main P5)
  - [[-1, 6, 16], 1, Concat, [1]]   # 19: Fuse [Up-P5 + Main P4 + Aux P4]
  - [-1, 2, C3k2, [512, False]]     # 20

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 21: Up-P4
  - [[-1, 4, 15], 1, Concat, [1]]   # 22: Fuse [Up-P4 + Main P3 + Aux P3]
  - [-1, 2, C3k2, [256, False]]     # 23: (Small Object Result)

  - [-1, 1, Conv, [256, 3, 2]]      # 24: Down to P4
  - [[-1, 20], 1, Concat, [1]]      # 25: Concat with P4 Head
  - [-1, 2, C3k2, [512, False]]     # 26: (Medium Object Result)

  - [-1, 1, Conv, [512, 3, 2]]      # 27: Down to P5
  - [[-1, 11, 17], 1, Concat, [1]]  # 28: Fuse [Down-P5 + Main P5 + Aux P5]
  - [-1, 2, C3k2, [1024, True]]     # 29: (Large Object Result)

  - [[23, 26, 29], 1, Detect, [nc]] # 30: Final Multi-Scale Detection