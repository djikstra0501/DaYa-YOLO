# Ultralytics YOLOv8 object detection model with P3/8 - P5/32 outputs
# Model docs: https://docs.ultralytics.com/models/yolov8
# Task docs: https://docs.ultralytics.com/tasks/detect

# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolov8n.yaml' will call yolov8.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.33, 0.25, 1024] # YOLOv8n summary: 129 layers, 3157200 parameters, 3157184 gradients, 8.9 GFLOPS
  s: [0.33, 0.50, 1024] # YOLOv8s summary: 129 layers, 11166560 parameters, 11166544 gradients, 28.8 GFLOPS
  m: [0.67, 0.75, 768] # YOLOv8m summary: 169 layers, 25902640 parameters, 25902624 gradients, 79.3 GFLOPS
  l: [1.00, 1.00, 512] # YOLOv8l summary: 209 layers, 43691520 parameters, 43691504 gradients, 165.7 GFLOPS
  x: [1.00, 1.25, 512] # YOLOv8x summary: 209 layers, 68229648 parameters, 68229632 gradients, 258.5 GFLOPS

# YOLOv8.0n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]              # 0-P1/2
  - [-1, 1, GSConv, [128, 3, 2]]           # 1-P2/4
  
  - [-1, 1, C2f, [128, True]]              # 2
  - [-1, 1, GhostConv, [128]]              # 3 
  
  - [-1, 1, C2f, [256, True]]              # 4
  - [-1, 1, GSConv, [256, 3, 2]]           # 5-P3/8
  
  - [-1, 1, C2f, [512, True]]              # 6 (P4)
  - [-1, 1, Conv, [256, 3, 2]]             # 7
  - [-1, 1, GhostConv, [512]]              # 8
  - [-1, 1, HorBlock, [512]]               # 9
  
  - [-1, 1, SPPF, [512, 5]]                # 10 P5

head:
  # ================= TOP–DOWN =================

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 11 upsample P5 → P4 size
  - [[-1, 6], 1, Concat, [1]]                    # 12 concat with P4
  - [-1, 1, VoVGSCSP, [512, 1]]                  # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 14 upsample → P3 size
  - [[-1, 4], 1, Concat, [1]]                    # 15 concat with P3
  - [-1, 1, C2f, [256, True]]                    # 16 (P3_head)

  # ================= BOTTOM–UP =================

  # P4 Head
  - [-1, 1, Conv, [256, 3, 2]]                   # 17 downsample P3 → P4
  - [[-1, 13], 1, Concat, [1]]                   # 18 concat with top-down P4
  - [-1, 1, C2f, [512, True]]                    # 19 (P4_head)

  # P5 Head
  - [-1, 1, GSConv, [512, 3, 2]]                 # 20 downsample P4 → P5
  - [[-1, 10], 1, Concat, [1]]                   # 21 concat with backbone P5
  - [-1, 1, C2f, [512, True]]                    # 22
  - [-1, 1, CBAM, []]                            # 23 (P5_head)

  # Final Detect
  - [[16, 19, 23], 1, Detect, [nc]]              # P3, P4, P5 outputs