# Ultralytics YOLOv8 object detection model with P3/8 - P5/32 outputs
# Model docs: https://docs.ultralytics.com/models/yolov8
# Task docs: https://docs.ultralytics.com/tasks/detect

# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolov8n.yaml' will call yolov8.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.33, 0.25, 1024] # YOLOv8n summary: 129 layers, 3157200 parameters, 3157184 gradients, 8.9 GFLOPS
  s: [0.33, 0.50, 1024] # YOLOv8s summary: 129 layers, 11166560 parameters, 11166544 gradients, 28.8 GFLOPS
  m: [0.67, 0.75, 768] # YOLOv8m summary: 169 layers, 25902640 parameters, 25902624 gradients, 79.3 GFLOPS
  l: [1.00, 1.00, 512] # YOLOv8l summary: 209 layers, 43691520 parameters, 43691504 gradients, 165.7 GFLOPS
  x: [1.00, 1.25, 512] # YOLOv8x summary: 209 layers, 68229648 parameters, 68229632 gradients, 258.5 GFLOPS

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv,   [64, 3, 2]]           # 0  P1/2
  - [-1, 1, Conv,   [128, 3, 2]]          # 1  P2/4
  - [-1, 3, C2f,   [128, True]]           # 2  P2 feat
  - [-1, 1, Conv,   [256, 3, 2]]          # 3  P3/8
  - [-1, 6, C2f,   [256, True]]           # 4  P3 feat
  - [-1, 1, Conv,   [512, 3, 2]]          # 5  P4/16
  - [-1, 6, C2f,   [512, True]]           # 6  P4 feat
  - [-1, 1, Conv,   [1024, 3, 2]]         # 7  P5/32
  - [-1, 3, C2f,   [1024, True]]          # 8  P5 feat
  - [-1, 1, SPPF,  [1024, 5]]             # 9
  - [-1, 1, TripletAttention, []]         # 10

head:
  # --- Low-GD ---
  - [[2, 4, 6, 10], 1, SimFusion_4in, []]                          # 11  concat 4 scales
  - [-1,            1, IFM,           [[64, 32]]]                   # 12  low global tokens (tuple)

  - [10,            1, Conv,          [512, 1, 1]]                  # 13  reduce P5

  - [[4, 6, 13],    1, SimFusion_3in, [512]]                        # 14  align P3/P4/P5_reduced → 512ch
  - [[-1, 12],      1, InjectionMultiSum_Auto_pool, [512, [64, 32], 0]]  # 15  inject token[0]
  - [-1,            3, C2f,           [512]]                        # 16  P4-level feat

  - [6,             1, Conv,          [256, 1, 1]]                  # 17  reduce P4

  - [[2, 4, 17],    1, SimFusion_3in, [256]]                        # 18  align P2/P3/P4_reduced → 256ch
  - [[-1, 12],      1, InjectionMultiSum_Auto_pool, [256, [64, 32], 1]]  # 19  inject token[1]
  - [-1,            3, C2f,           [256]]                        # 20  P3-level feat  ← detect output 0

  # --- High-GD ---
  - [[20, 16, 10],  1, PyramidPoolAgg,    [352, 2]]                 # 21  pool-agg 3 scales
  - [-1,            1, TopBasicLayer,     [352, [64, 128]]]         # 22  high global tokens (tuple)

  - [[20, 17],      1, AdvPoolFusion,     []]                       # 23  fuse P3+P4_reduced
  - [[-1, 22],      1, InjectionMultiSum_Auto_pool, [256, [64, 128], 0]]  # 24  inject token[0]
  - [-1,            3, C2f,               [256]]                    # 25  N4 feat  ← detect output 1

  - [[-1, 13],      1, AdvPoolFusion,     []]                       # 26  fuse N4+P5_reduced
  - [[-1, 22],      1, InjectionMultiSum_Auto_pool, [512, [64, 128], 1]]  # 27  inject token[1]
  - [-1,            3, C2f,               [1024]]                   # 28  N5 feat  ← detect output 2

  - [[20, 25, 28],  1, Detect,            [nc]]                     # 29