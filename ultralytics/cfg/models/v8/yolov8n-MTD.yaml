# MTD-YOLO comparison model — MobileNetV3 backbone + C2f-T neck
# Zhang et al., Electronics 2025, 14(14):2912

# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolov8n.yaml' will call yolov8.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.33, 0.25, 1024] # YOLOv8n summary: 129 layers, 3157200 parameters, 3157184 gradients, 8.9 GFLOPS
  s: [0.33, 0.50, 1024] # YOLOv8s summary: 129 layers, 11166560 parameters, 11166544 gradients, 28.8 GFLOPS
  m: [0.67, 0.75, 768] # YOLOv8m summary: 169 layers, 25902640 parameters, 25902624 gradients, 79.3 GFLOPS
  l: [1.00, 1.00, 512] # YOLOv8l summary: 209 layers, 43691520 parameters, 43691504 gradients, 165.7 GFLOPS
  x: [1.00, 1.25, 512] # YOLOv8x summary: 209 layers, 68229648 parameters, 68229632 gradients, 258.5 GFLOPS

backbone:
  # [from, repeats, module, args]                              # MobileNetV3-small stage
  - [-1, 1, Conv,    [16, 3, 2]]                                # 0  stem, HSwish, /2
  - [-1, 1, MBConv,  [16, 3, 2, 1, True,  False]]                # 1  /4   SE, ReLU
  - [-1, 1, MBConv,  [24, 3, 2, 4.5, False, False]]              # 2  /8   no SE, ReLU
  - [-1, 1, MBConv,  [24, 3, 1, 3.67, False, False]]             # 3  /8
  - [-1, 1, MBConv,  [40, 5, 2, 4,   True,  True]]               # 4  /16  P3  SE, HSwish
  - [-1, 1, MBConv,  [40, 5, 1, 6,   True,  True]]               # 5  /16
  - [-1, 1, MBConv,  [40, 5, 1, 6,   True,  True]]               # 6  /16
  - [-1, 1, MBConv,  [48, 5, 1, 3,   True,  True]]                # 7  /16
  - [-1, 1, MBConv,  [48, 5, 1, 3,   True,  True]]                # 8  /16
  - [-1, 1, MBConv,  [96, 5, 2, 6,   True,  True]]               # 9  /32  P4
  - [-1, 1, MBConv,  [96, 5, 1, 6,   True,  True]]               # 10 /32
  - [-1, 1, MBConv,  [96, 5, 1, 6,   True,  True]]               # 11 /32  P5
  - [-1, 1, SPPF,    [96, 5]]                                    # 12

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 13
  - [[-1, 8], 1, Concat, [1]]                    # 14  cat P4 (layer 8, c=48)
  - [-1, 2, C2f_T,  [96, True]]                  # 15

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 16
  - [[-1, 3], 1, Concat, [1]]                    # 17  cat P3 (layer 3, c=24)
  - [-1, 2, C2f_T,  [48, True]]                  # 18  → P3 out

  - [-1, 1, Conv,   [48, 3, 2]]                  # 19
  - [[-1, 15], 1, Concat, [1]]                   # 20
  - [-1, 2, C2f_T,  [96, True]]                  # 21  → P4 out

  - [-1, 1, Conv,   [96, 3, 2]]                  # 22
  - [[-1, 12], 1, Concat, [1]]                   # 23
  - [-1, 2, C2f_T,  [96, True]]                  # 24  → P5 out

  - [[18, 21, 24], 1, Detect, [nc]]              # 25